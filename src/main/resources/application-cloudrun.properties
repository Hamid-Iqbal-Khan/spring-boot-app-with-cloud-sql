# Activated automatically when SPRING_PROFILES_ACTIVE=cloudrun is set on Cloud Run
spring.datasource.url=jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Cloud Run sets PORT env var; Spring Boot reads server.port from it
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Reduce noise in Cloud Logging — INFO is sufficient in production
logging.level.root=INFO
logging.level.com.cloud.sql=INFO

# Enable request body logging in Cloud Logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
