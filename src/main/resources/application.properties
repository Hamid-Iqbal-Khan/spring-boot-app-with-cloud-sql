spring.application.name=spring-boot-app-with-cloud-sql
server.forward-headers-strategy=framework
server.port=8081
# Local (via Cloud SQL Auth Proxy): override with -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5433/postgres
